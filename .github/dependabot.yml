version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 5
      semver-major-days: 30
    groups:
      # Geen minor: bij 0.x-pakketten en TypeScript breekt een minor update vaak.
      npm-patch:
        update-types: ["patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  # De versies van de actions in .github/workflows, ook die van de deploy-workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
